<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Decentralized systems, smart contracts and fullstack development</title>
  <desc id="desc">A dark technical banner with a connected network motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#071f2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="22" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="278" rx="21" fill="none" stroke="url(#accent)" stroke-opacity=".55"/>

  <g fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity=".65">
    <path d="M70 72L170 42l94 61 105-48"/>
    <path d="M70 72l42 112 107 38 45-119"/>
    <path d="M219 222l92-57 58-110"/>
    <path d="M830 54l88 56 102-47 111 71"/>
    <path d="M918 110l38 111 98-44 77-43"/>
    <path d="M830 54l-33 117 159 50"/>
  </g>

  <g fill="#0f172a" stroke="#67e8f9" stroke-width="2" filter="url(#glow)">
    <circle cx="70" cy="72" r="7"/><circle cx="170" cy="42" r="7"/>
    <circle cx="264" cy="103" r="7"/><circle cx="369" cy="55" r="7"/>
    <circle cx="112" cy="184" r="7"/><circle cx="219" cy="222" r="7"/>
    <circle cx="311" cy="165" r="7"/>
    <circle cx="830" cy="54" r="7"/><circle cx="918" cy="110" r="7"/>
    <circle cx="1020" cy="63" r="7"/><circle cx="1131" cy="134" r="7"/>
    <circle cx="797" cy="171" r="7"/><circle cx="956" cy="221" r="7"/>
    <circle cx="1054" cy="177" r="7"/>
  </g>

  <g text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="600" y="118" fill="#f8fafc" font-size="35" font-weight="700" letter-spacing="3">BUILDING TRUST IN CODE</text>
    <rect x="421" y="139" width="358" height="3" rx="2" fill="url(#accent)"/>
    <text x="600" y="178" fill="#cbd5e1" font-size="16" font-weight="600" letter-spacing="2">BLOCKCHAIN · BACKEND · WEB</text>
  </g>
</svg>
